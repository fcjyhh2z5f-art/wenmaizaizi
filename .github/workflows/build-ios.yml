name: Build unsigned iOS IPA for WenMaiZaiZi

on:
  workflow_dispatch:
  # 升级时任何一次 push 都重新编译，不限制改动文件；也可在 Actions 手动 Run workflow
  push:
    branches: [ main ]

# 不再用 concurrency：第 4 次运行在 2 秒内就被取消，怀疑是并发组把新任务自己掐掉了
permissions:
  contents: write

jobs:
  build:
    # 前三次用 macos-15 都在排队 15 分钟后没分配到 runner 被取消，
    # 换一个独立的 runner 池试试；两个标签都是 GitHub 托管、公开仓库免费。
    runs-on: macos-14
    # 云端 macOS runner 排队可能较久；放宽单任务上限，避免编译刚跑到一半被掐断
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate iOS project and copy web assets
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Set Chinese display name on home screen
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path('ios/App/App/Info.plist')
          d = plistlib.loads(p.read_bytes())
          d['CFBundleDisplayName'] = '文脉在兹'
          p.write_bytes(plistlib.dumps(d))
          print('CFBundleDisplayName = 文脉在兹')
          PY

      - name: Archive WITHOUT signing (signature is done later by i4 / Aisi)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet clean archive

      - name: Pack unsigned IPA with ASCII-only paths
        run: |
          APP_PATH=$(find "$PWD/build/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo 'No .app produced'; exit 1; fi
          echo "Found: $APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 爱思助手错误码 45 常由压缩包内中文路径引起，这里先自检
          if find Payload | LC_ALL=C grep -q '[^ -~]'; then
            echo 'Non-ASCII path found inside IPA, would break i4 signing:'
            find Payload | LC_ALL=C grep '[^ -~]' | head -20
            exit 1
          fi
          zip -qr WenMaiZaiZi-unsigned.ipa Payload
          ls -lh WenMaiZaiZi-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WenMaiZaiZi-unsigned-ipa
          path: WenMaiZaiZi-unsigned.ipa
          retention-days: 30

      - name: Publish IPA as an anonymous-downloadable release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='v3.0.0'
          NOTES="Unsigned build: $GITHUB_SHA | run #$GITHUB_RUN_NUMBER | $(date -u '+%Y-%m-%d %H:%M UTC'). Sign with i4 / Aisi on Windows; free Apple ID signature must be renewed every 7 days."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" WenMaiZaiZi-unsigned.ipa --clobber
            # 滚动 tag 覆盖上传后同步更新说明，方便本机确认取回的是不是最新一次构建
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" WenMaiZaiZi-unsigned.ipa \
              --title 'WenMaiZaiZi unsigned IPA' \
              --notes "$NOTES"
          fi
          echo "Build: $NOTES"
          echo "Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/WenMaiZaiZi-unsigned.ipa"
